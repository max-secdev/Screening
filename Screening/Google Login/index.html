<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <div class="leftsection">
                <img src="https://www.gstatic.com/images/branding/googleg_gradient/svg/googleg_gradient_standard_48px.svg" alt="google logo">
                <h1 class="leftsectiontext">Sign in</h1>
                <p class="leftsectiontext">Use your Google Account</p>
            </div>
            <div class="rightsection">
                <label for="email"></label>
                <input type="email" placeholder="Email or phone" id="email">
                <a id="forgotemail" class="googlelinks" href="https://htmlpreview.github.io/?https://github.com/max-secdev/Beyond-Html/blob/main/Html/Edit.html"><b>Forgot email?</b></a>
                <p>Not your computer? Use Guest mode to sign in privately.
                    <a class="googlelinks" href="https://support.google.com/chrome/answer/6130773?hl=en-GB" target="_blank"><b>Learn more about using Guest mode</b></a> </p>
                <div class="button">
                    <button id="createaccount" class="buttoncreate">Create account</button>
                    <button id="next" class="buttoncreate">Next</button>
                </div>
            </div>
        </section>
    </main>
    
</body>
</html>
